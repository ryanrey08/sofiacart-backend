; Image uploads may be up to 10 MB each (config/uploads.php). upload_max_filesize is a little above
; that so a slightly larger file gets Laravel's "too large" message instead of a failed upload.
; One request can carry several images (merchant registration: four files; product galleries; up to
; five return or payment photos), so post_max_size allows about ten of them.
upload_max_filesize = 12M
post_max_size = 100M

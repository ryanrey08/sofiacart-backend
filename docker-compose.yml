services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sofiacart-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
    command: sh -c "git config --global --add safe.directory /var/www || true; [ -f .env ] || cp .env.example .env; (grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force) && php-fpm"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: sofiacart-nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sofiacart-db
    environment:
      MYSQL_DATABASE: sofiacart
      MYSQL_USER: sofiacart
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sofiacart-redis
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: sofiacart-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: sofiacart
      PMA_PASSWORD: secret
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  mysql_data:
  vendor_data:
